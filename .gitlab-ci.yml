include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    # Immutable SHA carrying the cppcheck template (private#1262).
    ref: 241b058b3127118f71efd9d15ce767545754f26f
    file:
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/parser-parity.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/vrt-upload.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/cross-cutting-lint.yml'
      - '/ci-templates/domain-calls.yml'
      - '/ci-templates/cppcheck.yml'
      - '/ci-templates/auto-tag.yml'

variables:
  VAUCHI_SCRIPTS_REF: "241b058b3127118f71efd9d15ce767545754f26f"
  SAST_EXCLUDED_PATHS: "build/"
  SECRET_DETECTION_EXCLUDED_PATHS: "build/"
  SAST_ANALYZER_IMAGE_TAG: "5"

stages:
  - auto-tag
  - lint
  - deps
  - build
  - test
  - security
  - package
  - deploy

# A version bump merged to main is the release: the job pushes
# v<crate version> when that tag does not exist yet, so the tag always
# sits on the merged commit (private#1045). The crate is in qt-display/,
# not at the repository root.
auto-tag:version:
  extends: .auto-tag
  variables:
    AUTO_TAG_VERSION_CMD: "grep '^version' qt-display/Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/'"

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"

default:
  interruptible: true

build:qt:
  stage: build
  needs: []
  script:
    # Tokens.h is generated from the themes repo; nothing guarantees a
    # ../themes sibling in the runner's build slot, so fetch and generate
    # it here instead of relying on one left behind by another job.
    - git clone --depth 1 --branch main
        https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/themes.git
        ${CI_PROJECT_DIR}/themes-src
    - python3 ${CI_PROJECT_DIR}/themes-src/scripts/generate.py
    - mkdir -p build && cd build
    - cmake .. -DVAUCHI_TOKENS_INCLUDE=${CI_PROJECT_DIR}/themes-src/generated
    - cmake --build . --parallel
  artifacts:
    paths:
      - build/
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:unit:
  stage: test
  needs: [build:qt]
  variables:
    QT_QPA_PLATFORM: offscreen
  script:
    - cd build
    - ctest --output-on-failure
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The presentation state replays the fixtures of the Core in core-ref with no
# engine behind it (ADR-078 D-11). The fetch checks both files against Core's
# published digests.
contract:replay:
  stage: test
  needs: [build:qt]
  tags: [linux]
  script:
    - |
      mkdir -p build/contract-replay
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/vauchi%2Fcontract/repository/files/ci%2Ffetch-screen-catalog.py/raw?ref=e80a2560d3cef20b5cd994a841232edca13261cb" \
        -o build/contract-replay/fetch-screen-catalog.py
      python3 build/contract-replay/fetch-screen-catalog.py \
        build/contract-replay/screen-catalog.json --assembly \
        --presentation-contract build/contract-replay/presentation-contract.json
    - build/contract_replay_test
        build/contract-replay/presentation-contract.json
        build/contract-replay/screen-catalog.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:rust-wrapper:
  stage: test
  needs: []
  tags: [linux]
  timeout: 15m
  variables:
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/qt-display/target"
  script:
    - mkdir -p library-check
    - git archive --output=library-check.tar HEAD
    - tar -xf library-check.tar -C library-check
    - unset VAUCHI_TOKENS_INCLUDE
    - cargo fmt --manifest-path library-check/qt-display/Cargo.toml -- --check
    - cargo clippy --manifest-path library-check/qt-display/Cargo.toml --all-targets --locked -- -D warnings
    - cargo test --manifest-path library-check/qt-display/Cargo.toml --all-targets --locked
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Coverage: build with gcov instrumentation, run tests, produce Cobertura XML.
# CMakeLists.txt already supports -DCOVERAGE=ON for gcov/lcov flags.
# Uses gcovr for Cobertura conversion and pushes metrics to Grafana Pushgateway.
coverage:unit:
  stage: test
  needs: []
  variables:
    QT_QPA_PLATFORM: offscreen
  script:
    - git clone --depth 1 --branch main
        https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/themes.git
        ${CI_PROJECT_DIR}/themes-src
    - python3 ${CI_PROJECT_DIR}/themes-src/scripts/generate.py
    - mkdir -p build-cov && cd build-cov
    - cmake .. -DVAUCHI_TOKENS_INCLUDE=${CI_PROJECT_DIR}/themes-src/generated -DCOVERAGE=ON
    - cmake --build . --parallel
    - ctest --output-on-failure || true
    - cd ${CI_PROJECT_DIR}
    - |
      # Produce Cobertura XML from gcov data (exclude tests/ and system headers)
      uvx --from gcovr==8.3 gcovr --root . --filter 'src/' \
        --xml cobertura.xml \
        --print-summary \
        build-cov/
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fci%2Fpush-coverage.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o push-coverage.sh
      chmod +x push-coverage.sh
    - ./push-coverage.sh cobertura.xml linux-qt || true
  coverage: '/Line Coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    paths:
      - cobertura.xml
    expire_in: 1 week
  tags: [linux]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/**"
          - "tests/**/*.cpp"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# AT-SPI semantics of the renderer: atspi_fixture_probe presents a surface
# fixture through the production PresentationSurface and the test reads the
# live accessibility bus. The tests that drove a whole app (launch,
# navigation, snapshots) run in linux-app against its qvauchi.
# Uses a venv with --system-site-packages so we can install pytest
# while inheriting gi (PyGObject), a system-only package for AT-SPI.
test:a11y:
  stage: test
  needs: [build:qt]
  tags: [linux, self-hosted]
  # A transient AT-SPI registration race heals on retry; a real regression
  # fails all attempts, so retry cannot mask a true break.
  retry:
    max: 2
    when:
      - script_failure
      - stuck_or_timeout_failure
      - runner_system_failure
  variables:
    QT_ACCESSIBILITY: "1"
  before_script:
    - uv venv --system-site-packages .venv
    - source .venv/bin/activate
    - uv pip install --quiet -r tests/atspi/requirements.txt
  script:
    - tests/atspi/run-tests.sh -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/**"
          - "tests/atspi/**"
          - "tests/atspi_fixture_probe.cpp"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Screen catalog: every app screen of Core's screen_catalog_v1.json rendered
# through the production renderer (surface, context bar, navigation sidebar;
# no navigation driven) to build/screen-catalog/ on every MR and main
# pipeline, in dark, light, and large-text variants. The full catalog is
# resolved from core-ref's contract dependency, with revision and hash
# preserved alongside the rendered artifacts. qt_display_render draws them
# on the qt_display library the apps assemble, without Core.
test:screen-catalog:
  stage: test
  needs: [build:qt]
  tags: [linux]
  allow_failure: false
  variables:
    QT_QPA_PLATFORM: offscreen
    VRT_PLATFORM: linux-qt
    VRT_SCREENSHOT_DIR: build/screen-catalog
  script:
    - |
      mkdir -p build
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/vauchi%2Fcontract/repository/files/ci%2Ffetch-screen-catalog.py/raw?ref=57defdf7231a592049a8fcab45cd8603e3ab5d40" \
        -o build/fetch-screen-catalog.py
      python3 build/fetch-screen-catalog.py screen-catalog.json --assembly
    - mkdir -p build/screen-catalog
    - build/qt_display_render --render-catalog screen-catalog.json build/screen-catalog 900 1400
    - echo "[screen-catalog] $(ls -1 build/screen-catalog | wc -l) PNG files in build/screen-catalog/"
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - screen-catalog.json
      - screen-catalog.provenance.json
      - screen-catalog.inventory.json
      - build/screen-catalog/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Security Stage
# ============================================================

semgrep-sast:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.cpp"
          - "**/*.h"
          - "**/*.hpp"
          - "CMakeLists.txt"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Presentation drift: verify every canonical presentation node is rendered.
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_PROTOCOL: "presentation"
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "src/coreui"
    CORE_PIN_FILE: "core-ref"
    CORE_PIN_KIND: "ref-file"
    CONTRACT_PIN_FILE: "contract-ref"
    CONTRACT_PIN_KIND: "ref-file"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/coreui/presentationsurface*.cpp"
          - ".gitlab-ci.yml"
          - "contract-ref"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/coreui/presentationsurface*.cpp"
          - ".gitlab-ci.yml"
          - "contract-ref"

# Parser-parity gate for Core's canonical PresentationNode enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "linux-qt"
    PARSER_FILE: "src/coreui"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "ci-templates-v2026.11.17"
    CORE_PIN_FILE: "core-ref"
    CORE_PIN_KIND: "ref-file"
    CONTRACT_PIN_FILE: "contract-ref"
    CONTRACT_PIN_KIND: "ref-file"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  variables:
    SEARCH_DIRS: "src/ tests/ include/"

# Cross-cutting lint bundle (blocking): design-token drift + Humble-UI ratchet.
# Replaces check:design-tokens and lint:humble per P3b.
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates bash findutils grep
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.baseline.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.baseline.json
      for file in check-no-core-build.sh check-no-core-build.baseline; do
        curl --silent --fail \
          "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2F${file}/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o ".ratchet-scripts/${file}"
      done
      chmod +x .ratchet-scripts/check-no-core-build.sh
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fcheck-design-tokens.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o check-design-tokens.sh
      chmod +x check-design-tokens.sh
    - ./check-design-tokens.sh --strict src/
    - python3 .ratchet-scripts/humble_check.py --repo "${CI_PROJECT_NAME}" --repo-path "${CI_PROJECT_DIR}" --config .ratchet-scripts/humble_check_rules.json --check .ratchet-scripts/humble_check.baseline.json
    # VCI01 (ADR-025): no Core build; this repository builds none since the
    # Qt pairing moved into linux-app (ADR-078, private#1029).
    - .ratchet-scripts/check-no-core-build.sh "${CI_PROJECT_DIR}" .ratchet-scripts/check-no-core-build.baseline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.cpp"
          - "**/*.cc"
          - "**/*.cxx"
          - "**/*.h"
          - "**/*.hpp"
          - ".gitlab-ci.yml"
          - "ci/**/*"
          - "scripts/**/*.sh"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Component tags require zero presentation-boundary counters. The app
# packages are linux-app's (private#1029).
release:ratchet-zero:
  extends: .release-ratchet-zero
  rules:
    - if: $CI_COMMIT_TAG

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror

# Pictogram copies match the vauchi/assets commit in pictograms/REVISION
# (#476): a hand edit or a half update fails here, while assets moving on
# never turns an unrelated MR red; the second job says when it has.
.pictogram-copies:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    PICTOGRAM_FORMAT: "svg"
    PICTOGRAM_COPIES: "resources/pictograms/{group}/{name}.svg"
  before_script:
    - apk add --no-cache python3 git
    - git clone --quiet https://gitlab.com/vauchi/assets.git /tmp/assets

check:pictogram-copies:
  extends: .pictogram-copies
  script:
    - git -C /tmp/assets checkout --quiet "$(cat pictograms/REVISION)"
    - python3 /tmp/assets/pictograms/check-copies.py --assets /tmp/assets --format "$PICTOGRAM_FORMAT" --copies "$PICTOGRAM_COPIES"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:pictogram-copies-current:
  extends: .pictogram-copies
  allow_failure: true
  script:
    - python3 /tmp/assets/pictograms/check-copies.py --assets /tmp/assets --format "$PICTOGRAM_FORMAT" --copies "$PICTOGRAM_COPIES" --behind "$(cat pictograms/REVISION)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Humble UI (ADR-021/043) and VRS02 (ADR-066): fail an MR that adds a
# domain-mutating call or a form-factor branch beyond .audit-baseline.json.
# The template defaults VAUCHI_SCRIPTS_REF to main; pin it to the include.
lint:domain-calls:
  extends: .domain-calls-job
  variables:
    VAUCHI_SCRIPTS_REF: "241b058b3127118f71efd9d15ce767545754f26f"

# Advisory cppcheck scan (private#1262): warning/performance/portability
# over the C++ display sources. windows-hw joins when its first C++ port
# lands — it has no C++ sources yet.
quality:cppcheck:
  extends: .cppcheck-job
  variables:
    CPPCHECK_PATHS: "src include tools tests"
